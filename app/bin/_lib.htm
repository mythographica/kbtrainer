/* Variables */

makeIWR = function(str, view){
	var miwr = mix("iwr").checked ? 1 : 0;
	var allpas = mix("allpas").checked ? 1 : 0;

	if(!miwr){
		var pas = { "" : [ /\n\r|\r\n|\n|\r/g , " ", " " ] };
	}else{
		if(allpas){
			var pas = { "" : [ /\n\r|\r\n|\n|\r/g , "&crarr;<br>", "¶" ] };
		}else{
			var pas = {
				  "?" : [ /\?\n\r|\?\r\n|\?\n|\?\r/g , "?&crarr;<br>", "?¶" ]
				, "!" : [ /\!\n\r|\!\r\n|\!\n|\!\r/g , "!&crarr;<br>", "!¶" ]
				, "." : [ /\.\n\r|\.\r\n|\.\n|\.\r/g , ".&crarr;<br>", ".¶" ]
				, ":" : [ /\:\n\r|\:\r\n|\:\n|\:\r/g , ":&crarr;<br>", ":¶" ]
				, "z" : [ /\n\r\n\r|\r\n\r\n|\n\n|\r\r/g , "<br>", "¶" ]
				, "d" : [ /\n\r\t*(?=[0-9])|\n\r\t*(?=[0-9])|\n\t*(?=[0-9])|\r\t*(?=[0-9])/g , "&crarr;<br>", "¶" ]
				, "az" : [ /\n\r\t*(?=[a-z]\.)|\n\r\t*(?=[a-z]\.)|\n\t*(?=[a-z]\.)|\r\t*(?=[a-z]\.)/g , "&crarr;<br>", "¶" ]
				, ""  : [ /\n\r|\r\n|\n|\r/g , " ", " " ]
				};
		}
	}
	for(var i in pas){
		str = str.replace(pas[i][0], (view ? pas[i][1] : pas[i][2]));
	}

	return str;
}

loadFile = function(ob){
	var errOnOpn = true;
	var strErr = "";
	try{
		file = tryOpnFile.selectedFile;
		var charset = mix("charset_id").value;
		if(file != ""){
			if(fs.exists(file.path)){
				var str = file.path.substring(0, 45 - file.name.length) + "&nbsp;&nbsp;...&nbsp;&nbsp;\\" + file.name;
				mix.In("pathTo", str);
				pathToFile = file.path;
				if(ob){
				if(ob.id == "btnOpenFile"){
					ev.t("pathToOver()", 200);
					ev.t("pathToOut()", 900);
				}}
				// reading file
				texter.str = "reading file... please wait...";
				ev.t("texter()", 100);
				var str = fs.readFileToString(file.path, charset);
				if(str){
					str = makeIWR(str.substr( 0, ( (str.length > 10000) ? 10000 : str.length ) ), true);
					texter.str = str;
					ev.t("texter()", 500);
					// reading file
					errOnOpn = false;
				}else{
					strErr += "<font color = \"red\" size = \"7\">Can't read from File...</font>"
				}
			}
		}
	}catch(e){ strErr += e;
	}finally{}
	if(errOnOpn){
		texter.str = strings.l0 + strings.l4 + "<br><br> " + strErr;
		ev.t("texter()", 1000);
	}
}

// Program.FileDialog (traced) around the native selector; FilePick when a
// file came back; close() hands program.dialog back to the library. The
// era in-app picker (bin/_fopn.htm) is ported but parked: its 2008-era
// layout renders poorly under Electron font metrics — revisit later.
tryOpnFile = function(ob){
	var errOnOpn = true;
	var strErr = "";
	// Program.FileDialog (traced) around the whole session
	var fileDialog = null;
	try{ if(program){ fileDialog = new program.FileDialog(); window.__fileDialog = fileDialog; } }catch(e){}
	try{
		var file = fs.openTextFileDlg();
		if(file){
			// the dialog returns a PATH (Electron showOpenDialog); turnObj
			// takes the {name, path, size} file object — fs.open builds it
			// from a path (the era page passed the path itself: broken)
			tryOpnFile.selectedFile = fs.turnObj(fs.open(file));
			try{ if(fileDialog){ new fileDialog.FilePick(tryOpnFile.selectedFile.path); } }catch(e){}
			loadFile(ob);
			errOnOpn = false;
		}
	}catch(e){ strErr += e;
	}finally{}
	try{ if(fileDialog){ fileDialog.close(); window.__fileDialog = null; } }catch(e){}
	if(errOnOpn){
		texter.str = strings.l0 + strings.l4_1 + " <br><br> " + strErr;
		mix.In("pathTo", "&nbsp;");
		ev.t("texter()", 1000);
	}
}
tryOpnFile.selectedFile = "";

// parked with the era picker port (bin/_fopn.htm) — kept for the later

window.__fopnPicked = function(){
	var fileDialog = window.__fileDialog || null;
	try{
		var p = (window.__fopnWin && window.__fopnWin.__fopnArgs) ? window.__fopnWin.__fopnArgs.path : null;
		if(p){
			tryOpnFile.selectedFile = fs.turnObj(fs.open(p));
			var lastSep = String(p).lastIndexOf(fs.sep);
			tryOpnFile.lastDir = (lastSep > 0) ? String(p).substring(0, lastSep) : fs.sep;
			try{ if(fileDialog){ new fileDialog.FilePick(tryOpnFile.selectedFile.path); } }catch(e){}
			loadFile(window.__fopnButton);
		}
	}catch(e){}
	try{ if(fileDialog){ fileDialog.close(); window.__fileDialog = null; } }catch(e){}
	window.__fopnWin = null;
	window.__fopnButton = null;
};
window.__fopnClosed = function(){
	try{ if(window.__fileDialog){ window.__fileDialog.close(); window.__fileDialog = null; } }catch(e){}
	window.__fopnWin = null;
	window.__fopnButton = null;
};
window.__fopnDirList = function(dir, entries){
	try{
		var fileDialog = window.__fileDialog;
		if(fileDialog){ new fileDialog.DirList(dir, entries); }
	}catch(e){}
};


saver = function(){
	if(tryOpnFile.selectedFile === ""){
		texter.str = strings.l0 + strings.l4;
		ev.t("texter()", 10);
	}else{
		var errOnOpn = true;
		var strErr = "";
		var booksMax = api.books(); //max boox number
		try{
			file = tryOpnFile.selectedFile;
			var charset = mix("charset_id").value;
			if(file != ""){
				if(fs.exists(file.path)){
					texter.str = strings.l5;
					ev.t("texter()", 100);
					var str = fs.readFileToString(file.path, charset);
					if(str){


						//очистка строки

						re = /--/g; str = str.replace(re,"-");
						re = /–/g; str = str.replace(re,"-");
						re = /«/g; str = str.replace(re,"\"");
						re = /»/g; str = str.replace(re,"\"");
						re = /—/g; str = str.replace(re,"-");

						re = /…/g;
						do{
							str = str.replace(re, "...");
						}while(str.indexOf("…")!=-1);


						str = makeIWR(str, false); // false -- by paragraph "¶"

						re = /  /g;
						do{
							str = str.replace(re, " ");
						}while(str.indexOf("  ")!=-1);

						re = /¶ /g;
						do{
							str = str.replace(re, "¶");
						}while(str.indexOf("  ") !=- 1);
						

						var chsps = true;
						do{
							if(str.length > 0){
								if(str.substr(0, 1) == " "){
									str = str.substring(1);
								}else{
									chsps = false;
								}
							}else{
								chsps = false;
							}
						}while(chsps == true);

						//очистка строки


						var kDir = fs.lib();
						// !!! NEVER use books.length here !!! Never !!!
						var locName = "book_" + booksMax + ".txt";
						var loc = kDir + locName;

						var autor_id_str = mix("autor").value;
						var bookname_id_str = mix("book").value;

						api.saveBook(loc, str, autor_id_str, bookname_id_str);
						// Program.LibDialog.BookImport (traced)
						record(function(dialog){ new dialog.BookImport(loc); });

						texter.str = "Saving DONE:<br>"+locName+"<br>"+autor_id_str+"<br>"+bookname_id_str+"<br>"+str.substr(0, ( (str.length > 10000) ? 10000 : str.length ) );
						ev.t("texter()", 500);
						errOnOpn = false;
						alert(strings.l3);

						loader();

					}else{
						strErr += "<font color = \"red\" size = \"7\">Can't read from File...</font>"
					}
				}
			}
		}catch(e){ strErr += e;
		}finally{}
		if(errOnOpn){
			texter.str = strings.l0 + strings.l4_1 + " <br><br> " + strErr;
			ev.t("texter()", 1000);
		}
	}
}

//-->
