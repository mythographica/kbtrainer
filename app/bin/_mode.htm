<script language = "JavaScript">
	// selector.js replacement (Electron port): selector.js never shipped
	// with the port; all it did was inject the current skin's stylesheet.
	(function(){
		try{
			var lk = document.createElement("link");
			lk.rel = "stylesheet";
			lk.type = "text/css";
			lk.href = "../skins/skin." + ((window.dialogArguments.user && window.dialogArguments.user.skin) || "native") + ".css";
			document.getElementsByTagName("head")[0].appendChild(lk);
		}catch(e){}
	})();
</script>

<style type = "text/css">

<body>
	<h3 id = "caption">&nbsp;</h3>
	<div id = "mode_selector">
		<span id = "span.mode.radio1"><input type="radio" name = "snk.mode.radio" id = "snk.mode.radio1"
			onclick = "setsMode()"><label for="snk.mode.radio1">&nbsp;</label></span>
		<span id = "span.mode.radio2"><input type="radio" name = "snk.mode.radio" id = "snk.mode.radio2"
			onclick = "setsMode()"><label for="snk.mode.radio2">&nbsp;</label></span>
		<span id = "span.mode.radio3"><input type="radio" name = "snk.mode.radio" id = "snk.mode.radio3"
			onclick = "setsMode()"><label for="snk.mode.radio3">&nbsp;</label></span><br>
	</div>
	<div id = "mode_lesson" style = "padding-left: 10px">
		<table border = "0" cellpadding = "2" cellspacing = "3" width = "670px" height = "220px">
			<tr valign = "top">
				<td width = "150px">
					<div id = "less_map_select"></div>
				</td><td style = "padding-left: 10px;">
					<div id = "less_select" style = ""></div>
				</td>
			</tr>
		</table>
	</div>
	<div id = "mode_books" style = "padding-left: 10px"></div>
	<div id = "mode_voc" style = "padding-left: 10px">
		<!-- vocabulary (the pre-lib/books mode): paste a text, type it once;
		     nothing is saved. The value round-trips through
		     dialogArguments.vocText (snk.changeMode) so re-opening keeps it. -->
		<textarea id = "snk.voc.text" spellcheck = "false"
			style = "width: 640px; height: 195px; font-family: monospace; font-size: 12px; border: 1px solid gray;"></textarea>
	</div>

</body>

<script language = "JavaScript">
<!--
// Program.ModeDialog (traced) — the dialog's domain node; null when the
// domain did not boot. The records below are best-effort: the dialog works
// without the domain, exactly like the era page did.
var domain = window.dialogArguments.domain || null;
var recordPick = function(make){
	try{ if(domain){ make(domain); } }catch(e){}
};

var buildSLmap = function(smap){
	mix.In("less_map_select", "");
	mix.In("less_select", "");
	var selected_item = "";
	for(var i in lessons.arr){
		var l_sel = mix.addObj("snk_map_" + i + "_select_id", "less_map_select", "INPUT", {
			  type	: "radio"
			, name	: "snk_map_select_id"
			, value	: i
		});
		l_sel.m.onclick = function(){
			selectedLessonMap = this.value;
			if(user.LessonNum[0] !== selectedLessonMap){
				user.LessonNum = [selectedLessonMap, "base0", 0];
				// Program.ModeDialog.LessonPick (traced)
				recordPick(function(dialog){ new dialog.LessonPick(user.LessonNum.join("_")); });
			}
			buildSLmap();
		};

		var l_sel_lbl = mix.addObj("snk." + i + ".lbl",	"less_map_select", "LABEL");
		l_sel_lbl.m.setAttribute("for", "snk_map_" + i + "_select_id");

		l_sel_lbl.In(((kb.map[i].language !== undefined) ? (kb.map[i].language) : i));
		l_sel_lbl.q.after("<br />");

		if(selectedLessonMap == i){
			if(i == user.LessonNum[0]) {
				l_sel.m.checked = true;
				l_sel_lbl.FW("bold");
				selectedLessonMap = i;
			}
		}
	}
	if(selectedLessonMap !== ""){
		var lm = lessons.arr[selectedLessonMap];
		for (var i in lm){
			for(var k in lm[i].les){
				var name = ""+selectedLessonMap+"_"+i+"_"+k;

				// the id must carry the FULL lesson name: the label's
				// for= snk_less_<name>_select_id resolves by id, and a
				// per-base id ("snk_less_" + i) made every lesson of a
				// base share ONE id — only the first radio kept a
				// handler and every label pointed nowhere, so a pick
				// always fell back to the first lesson (2026-09-28)
				var l_sel = mix.addObj("snk_less_" + name + "_select_id", "less_select", "INPUT", {
					  type	: "radio"
					, name	: "less_select_nm"
					, value	: name
				});

				l_sel.m.onclick = function(){
					user.LessonNum = this.value.split("_");
					// Program.ModeDialog.LessonPick (traced)
					recordPick(function(dialog){ new dialog.LessonPick(user.LessonNum.join("_")); });
					buildSLmap();
				};

				var l_sel_lbl = mix.addObj("snk." + name + ".lbl",	"less_select", "LABEL");
				l_sel_lbl.m.setAttribute("for", "snk_less_" + name + "_select_id");

				if((i == user.LessonNum[1]) && (k == user.LessonNum[2])){
					l_sel.m.checked = true;
					l_sel_lbl.FW("bold");
					l_sel_lbl.C("red");
					selected_item = l_sel;
				}

				var str = "<nobr>" + selectedLessonMap.toUpperCase() + " : " + lm[i].name + " -- " + lm[i].les[k].name + "</nobr>";

				l_sel_lbl.In(str);
				l_sel_lbl.q.after("<br />");
			}
		}
	}
	try{
		selected_item.m.focus();
	}catch(e){}finally{}
}

var setsMode = function(){
	mix.Fhide("mode_lesson");
	mix.Fhide("mode_books");
	mix.Fhide("mode_voc");
	if((mix("snk.mode.radio1").checked == true) && (mix("snk.mode.radio2").checked == false)){
		user.LessonsMode = "lesson";
		// Program.ModeDialog.ModeSet (traced): the chosen mode
		recordPick(function(dialog){ new dialog.ModeSet("lesson"); });
		buildSLmap();
	}
	if((mix("snk.mode.radio1").checked == false) && (mix("snk.mode.radio2").checked == true)){
		user.LessonsMode = "book";
		// Program.ModeDialog.ModeSet (traced): the chosen mode
		recordPick(function(dialog){ new dialog.ModeSet("book"); });
	}
	if((mix("snk.mode.radio3").checked == true) && (mix("snk.mode.radio1").checked == false) && (mix("snk.mode.radio2").checked == false)){
		user.LessonsMode = "vocabulary";
		// Program.ModeDialog.ModeSet (traced): the chosen mode
		recordPick(function(dialog){ new dialog.ModeSet("vocabulary"); });
	}
	if(user.LessonsMode == "lesson"){ mix("span.mode.radio1").setAttribute("hl", "true"); mix.Fshow("mode_lesson"); }
	if(user.LessonsMode == "book"){ mix("span.mode.radio2").setAttribute("hl", "true"); mix.Fshow("mode_books"); }
	if(user.LessonsMode == "vocabulary"){ mix("span.mode.radio3").setAttribute("hl", "true"); mix.Fshow("mode_voc"); }
}

var starter = function(){

	mix.In("caption", "&nbsp;<b>"+strings.s12+"</b>");
	mix.Fhide("mode_lesson");
	mix.Fhide("mode_books");
	mix.Fhide("mode_voc");
	// $("label[for='snk.mode.radio1']").html("&nbsp;" + strings.s18 + " [Ctrl + 1]&nbsp;&nbsp;");
	// $("label[for='snk.mode.radio2']").html("&nbsp;" + strings.s19 + " [Ctrl + 2]&nbsp;&nbsp;");
	$("label[for='snk.mode.radio1']").html("&nbsp;" + strings.s18 + "&nbsp;&nbsp; [1]&nbsp;&nbsp;");
	$("label[for='snk.mode.radio2']").html("&nbsp;" + strings.s19 + "&nbsp;&nbsp; [2]&nbsp;&nbsp;");
	// no era string for the third mode (2.1 never had it): the era's own word
	$("label[for='snk.mode.radio3']").html("&nbsp;vocabulary&nbsp;&nbsp; [3]&nbsp;&nbsp;");
	mix("snk.mode.radio1").checked = false;
	mix("snk.mode.radio2").checked = false;
	mix("snk.mode.radio3").checked = false;
	mix("span.mode.radio1").setAttribute("hl", "false");
	mix("span.mode.radio2").setAttribute("hl", "false");
	mix("span.mode.radio3").setAttribute("hl", "false");
	// the pasted vocabulary text round-trips through dialogArguments.vocText
	// (snk.changeMode) so re-opening the dialog keeps it — written LIVE on
	// every input (the args object is shared), because an outer
	// __kbDialog.close() never runs this page's onbeforeunload (only the
	// page's own Esc/Enter via kbDialogChild does)
	if(typeof window.dialogArguments.vocText === "string"){
		mix("snk.voc.text").value = window.dialogArguments.vocText;
	}
	mix("snk.voc.text").oninput = function(){
		window.dialogArguments.vocText = this.value;
	};

	var books = api.books(true);
	if(books.length > 0){

		mix.In("mode_books", "");
		for (var i in books){
			var b_sel = mix.addObj("snk_book_" + i + "_id", "mode_books", "INPUT", {
				  type	: "radio"
				, name	: "snk_books_select_id"
				, value	: books[i]["path"]
			});
			b_sel.m.onclick = function(){
				user.CurrentBook = this.value;
				// Program.ModeDialog.BookPick (traced)
				recordPick(function(dialog){ new dialog.BookPick(user.CurrentBook); });
			};


			var b_sel_lbl = mix.addObj("snk." + i + ".lbl",	"mode_books", "LABEL");
			b_sel_lbl.m.setAttribute("for", "snk_book_" + i + "_id");

			b_sel_lbl.In("" + books[i]["autor"] + "&nbsp; -- &nbsp;" + books[i]["book"]);
			b_sel_lbl.q.after("<br />");

			if(user.CurrentBook == books[i].path){
				b_sel.m.checked = true;
			}
		}
	}else{
		mix.In("mode_books", strings.s14);
	}

	if(user.LessonsMode == "lesson"){
		mix("snk.mode.radio1").checked = true;
		mix("span.mode.radio1").setAttribute("hl", "true");
		mix.Fshow("mode_lesson");
		buildSLmap();
	}
	if(user.LessonsMode == "book"){
		mix("snk.mode.radio2").checked = true;
		mix("span.mode.radio2").setAttribute("hl", "true");
		mix.Fshow("mode_books");
	}
	if(user.LessonsMode == "vocabulary"){
		mix("snk.mode.radio3").checked = true;
		mix("span.mode.radio3").setAttribute("hl", "true");
		mix.Fshow("mode_voc");
	}

	// the smoke test listens for this
	window.__modeReady = true;
}

kbDown = function(event){
	var z = event.keyCode;
	var ctrlK = event.ctrlKey;
	var altK = event.altKey;
	var shiftK = event.shiftKey;
	if (z == 115){ window.close(); }
	if (z == 13){ window.close(); }
	if (z == 27){ window.close(); }
	if (z == 119){ evop = "lib"; window.close(); }					// F8
	if ((z == 10) || (z == 255) || ((z > 112) && (z < 115)) || ((z > 115) && (z < 119)) || ((z > 119) && (z < 123))){ fns.cancl(evt); }
	//if(ctrlK){
	if(z == 49){ mix("snk.mode.radio1").click(); } // [1]
	if(z == 50){ mix("snk.mode.radio2").click(); } // [2]
	if(z == 51){ mix("snk.mode.radio3").click(); } // [3]
	//}
}

var evop = window.dialogArguments.ev;
var app = window.dialogArguments.app;
var snkt = window.dialogArguments.snk;
var kb = window.dialogArguments.kb;
var user = window.dialogArguments.user;
var kernel = window.dialogArguments.kernel;
var skins = window.dialogArguments.skins;
var lessons = window.dialogArguments.lessons;
var strings = window.dialogArguments.strings;

var lessonSelMode = "";
var selectedLessonMap = user.LessonNum[0];

window.onbeforeunload = function(){
	window.dialogArguments.user = user;
	window.dialogArguments.evop = evop;
	// the pasted vocabulary text travels back with the dialog
	window.dialogArguments.vocText = mix("snk.voc.text").value;
}

try{ window.moveTo(user.wsL, user.wsT); }catch(e){}
ev.WinEvent("onkeydown", "kbDown");

ev.t("starter()", 500);
//-->
</script>
