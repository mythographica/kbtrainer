<script language="JavaScript" type="text/javascript">

// Electron port of the era keyboard-first file picker (was FSO/ActiveX +
// showModalDialog; see reports/domain-wiring.md §3). Opened from the
// library dialog's "..." button via window.open; the pick travels back
// through window.__fopnArgs (kbDialogChild's dialogArguments contract when
// opened inside the overlay, or the opener-set __fopnArgs as a child
// window): args.path = the picked path STRING, then the child calls
// window.opener.__fopnPicked() and closes. "My Computer" is the filesystem
// root; the quick panel maps era SpecialFolders onto Linux homes.

var currentDisc = "";
var currentPath = "";
var lastEntries = [];
var __picked = false;

var grFold = "<br>&nbsp;*&nbsp;*&nbsp;**<br>";
grFold += "&nbsp;*&nbsp;*&nbsp;**<br>";
grFold += "&nbsp;*&nbsp;*&nbsp;**";
var grFils = "&nbsp;&nbsp;------------<br>";
grFils += "&nbsp;&nbsp;------------<br>";
grFils += "&nbsp;&nbsp;------------<br>";
grFils += "&nbsp;&nbsp;------------<br>";
grFils += "&nbsp;&nbsp;------------<br>";
grFils += "&nbsp;&nbsp;------------<br>";
grFils += "&nbsp;&nbsp;------------";

var args = function(){
	return window.__fopnArgs || window.dialogArguments || null;
};

// folder listing through the kbfs bridge: dirs first, then files
// (returns [{name, path, isDir, size}] or false)
getContent = function(par){
	if(!par){ par = currentPath; }
	if(par == "root"){
		var root = fs.listDir(fs.sep);
		if(!root){ return []; }
		return root.map(function(x){
			return [x.name, x.path, x.isDir ? "fol" : "fil", "", x.size];
		});
	}
	var cc = fs.listDir(par);
	if(!cc){ return []; }
	var arr = [];
	for(var i in cc){
		if(!cc[i]){ continue; }
		arr[arr.length] = [cc[i].name, cc[i].path, cc[i].isDir ? "fol" : "fil", "", cc[i].size];
	}
	return arr;
};

// breadcrumb chain (era takePath): [[name, fullPath], ...] root-first
takePath = function(par, arr){
	if(par === undefined){ par = currentPath; }
	if(arr === undefined){ arr = []; }
	var p = String(par);
	if(p === fs.sep || p === ""){
		arr[arr.length] = [fs.sep, fs.sep];
		return arr;
	}
	var base = p.split(fs.sep).pop();
	arr[arr.length] = [base || p, p];
	var parent = p.substring(0, p.length - base.length - 1) || fs.sep;
	return takePath(parent, arr);
};

// era used event.srcElement + a global event; port passes the element
gonEl = function(src){
	var srcP = src.getAttribute("pathr");
	if(srcP == null){ return; }
	if(srcP == "root"){
		currentPath = "root";
		makeRoot();
		mix("buttonUpPanel").onclick = "";
		with(mix.s("buttonUpPanel")){
			background = "buttonface";
			cursor = "default";
			color = "gray";
		}
		makeFolderUpPanel();
		return;
	}
	var st = fs.exists(srcP);
	if(st && st.isDir){
		currentPath = srcP;
		makePath();
		// Program.FileDialog.DirList (traced) — the opener records it
		try{ if(window.opener && window.opener.__fopnDirList){ window.opener.__fopnDirList(srcP, lastEntries); } }catch(e){}
	}else if(st && st.isFile){
		// clear the previous selection, mark this one
		var panel = document.getElementById("folderPanel");
		var olds = panel.getElementsByClassName("filSelected");
		for(var i = olds.length - 1; i >= 0; i--){ olds[i].className = "tdfl"; }
		var tr = src;
		while(tr && tr.tagName !== "TR"){ tr = tr.parentNode; }
		if(tr){
			var td = tr.getElementsByTagName("TD");
			for(var j = 0; j < td.length; j++){
				if(td[j].className === "tdfl"){ td[j].className = "filSelected"; }
			}
		}
		mix.In("selectedPanel", srcP);
	}
};
gon = function(ev){ gonEl((ev || window.event).target); };

makeFolderUpPanel = function(){
	var str = "<div style = \"position: absolute; height: 18px; width: 364px; overflow: hidden\">";
	if(currentPath != "root"){
		str += (currentPath === fs.sep) ? fs.sep : currentPath.split(fs.sep).pop();
		with(mix.s("upFolderPanel")){
			border = "1px solid gray";
			background = "white";
			height = "23px";
			overflow = "hidden";
			cursor = "pointer";
		}
		mix("upFolderPanel").onclick = makeFolderUpPanelDown;
	}else{
		str += "My Computer";
		with(mix.s("upFolderPanel")){
			border = "1px solid gray";
			background = "buttonface";
			height = "23px";
			overflow = "hidden";
			cursor = "default";
		}
		mix("upFolderPanel").onclick = "";
	}
	str += "</div>";
	str += "<div ";
	str += " style = \"position: absolute; width: 22px; top: 2px; left: 374px;";
	str += " border: 1px solid gray; color: gray; ";
	str += " padding: 2px; font-size: 9px; text-align: center\"";
	str += " >&darr;-&darr;";
	str += "</div>";
	mix.In("upFolderPanel", str);
	str = "";
};

makeFolderUpPanelMouseOver = function(ev){
	var src = (ev || window.event).target;
	with(src.style){
		background = "buttonface";
		borderBottom = "1px solid gray";
		cursor = "crosshair";
	}
};
makeFolderUpPanelMouseOut = function(ev){
	var src = (ev || window.event).target;
	with(src.style){
		background = "white";
		borderBottom = "0px solid gray";
		cursor = "auto";
	}
};

makeFolderUpPanelDown = function(){
	if(currentPath == "root"){ return; }
	with(mix.s("upFolderPanel")){
		border = "1px solid black";
		background = "white";
		height = "200px";
		overflow = "auto";
	}
	var str = "";
	str += "<div style = \"position: relative; margin-left: 10px; padding-left: 5px; padding-right: 3px;";
	str += " height: 20px; overflow: hidden;\"";
	str += " pathr = \"root\" onclick = \"gon(event)\"";
	str += " onmouseover = \"makeFolderUpPanelMouseOver(event)\" onmouseout = \"makeFolderUpPanelMouseOut(event)\" >";
	str += "My Computer";
	str += "</div>";
	var arr = takePath(currentPath);
	for(var i = arr.length - 1; i >= 0; i--){
		str += "<div style = \"position: relative; margin-left: " + ((arr.length - i) * 10) + "px; padding-left: 5px; padding-right: 3px;";
		str += " height: 20px; overflow: hidden;\"";
		str += " pathr = \"" + arr[i][1] + "\" onclick = \"gon(event)\"";
		str += " onmouseover = \"makeFolderUpPanelMouseOver(event)\" onmouseout = \"makeFolderUpPanelMouseOut(event)\" >";
		str += arr[i][0];
		str += "</div>";
	}
	mix.In("upFolderPanel", str);
	mix("upFolderPanel").onclick = makeFolderUpPanel;
	str = "";
};

makeRoot = function(){
	var cc = getContent("root");
	lastEntries = cc;
	mix.In("folderPanel", " ");
	var str = "<table border = \"0\" style = \"margin-top: 25px; margin-left: 10px\">";
	for(var i in cc){
		if(!cc[i]){ continue; }
		str += "<tr>";
		str += " <td class = \"drv1\" pathr = \"" + cc[i][1];
		str += "\" onclick = \"gon(event)\"> " + cc[i][0] + " </td>";
		str += " <td class = \"drv2\" pathr = \"" + cc[i][1];
		str += "\" onclick = \"gon(event)\"> (" + (cc[i][2] === "fol" ? "folder" : "file") + ") </td>";
		str += " <td class = \"drv3\"> " + (cc[i][2] === "fol" ? "" : cc[i][4] + " b") + " </td>";
		str += "</tr>";
	}
	str += "</table>";
	document.getElementById("folderPanel").insertAdjacentHTML("beforeend", str);
};

makePath = function(){
	var cc = getContent();
	lastEntries = cc;

	var parent = fs.sep;
	if(currentPath !== fs.sep){
		var base = currentPath.split(fs.sep).pop();
		parent = currentPath.substring(0, currentPath.length - base.length - 1) || fs.sep;
	}
	mix("buttonUpPanel").setAttribute("pathr", (currentPath === fs.sep) ? "root" : parent);
	mix("buttonUpPanel").onclick = gon;
	with(mix.s("buttonUpPanel")){
		background = "white";
		cursor = "pointer";
		color = "black";
	}

	mix.In("folderPanel", " ");
	var str = "";
	for(var i in cc){
		if(!cc[i]){ continue; }
		str = "<table border = \"0\"><tr>";
		if(cc[i][2] == "fol"){
			str += "<td><span class = \"fold\" pathr = \"" + cc[i][1] + "\" ondblclick = \"gon(event)\">" + grFold + "</span></td>";
		}else{
			str += "<td><span class = \"fil\" pathr = \"" + cc[i][1] + "\" onclick = \"gon(event)\">" + grFils + "</span></td>";
		}
		str += " <td  class = \"tdfl\" pathr = \"" + cc[i][1] + "\"";
		if(cc[i][2] == "fol"){
			str += " ondblclick";
		}else{
			str += " onclick";
		}
		str += " = \"gon(event)\">" + cc[i][0] + "</td>";
		str += "</tr></table>";
		document.getElementById("folderPanel").insertAdjacentHTML("beforeend", str);
	}
	makeFolderUpPanel();
	str = "";
};

// validate the selectedPanel path and hand it to the opener (era
// fileSelection; par = invoked by the OK button)
fileSelection = function(par){
	var sel = mix.In("selectedPanel") || "";
	var st = sel ? fs.exists(sel) : false;
	if(st && st.isFile){
		__picked = true;
		args().path = sel;
		try{ if(window.opener && window.opener.__fopnPicked){ window.opener.__fopnPicked(); } }catch(e){}
		window.close();
		return true;
	}
	if(par === true){
		if(window.confirm("You didn't select the file, Continue?")){
			__picked = true;
			args().path = false;
			try{ if(window.opener && window.opener.__fopnPicked){ window.opener.__fopnPicked(); } }catch(e){}
			window.close();
		}
	}
	return false;
};

// programmatic pick — the smoke gate drives this end to end
window.__fopnPick = function(path){
	mix.In("selectedPanel", path);
	return fileSelection(true);
};

init = function(){
	var da = args();
	if(!da){
		// the opener may still be wiring __fopnArgs (window.open returns
		// before the child loads) — poll briefly, then close silently
		var tries = 0;
		var iv = setInterval(function(){
			tries++;
			da = args();
			if(da){
				clearInterval(iv);
				initWith(da);
			}else if(tries > 40){
				clearInterval(iv);
				window.close();
			}
		}, 50);
		return;
	}
	initWith(da);
};

initWith = function(da){
try{
	mix("myDocsPanel").onclick = function(){ currentPath = "" + kbfs.appPath(); makePath(); makeFolderUpPanel(); };
	mix("myCompPanel").onclick = function(){ currentPath = "root"; makeRoot(); makeFolderUpPanel(); };
	// no WSH SpecialFolders on Linux: Desktop maps to /home
	mix("desktopPanel").onclick = function(){ currentPath = "/home"; makePath(); makeFolderUpPanel(); };
	mix("selectedButton").onclick = function(){
		return fileSelection(true);
	};
	// Esc closes (era onkeypress 27); a valid selection is picked, empty
	// cancels — the opener's __fopnClosed finishes the FileDialog record
	document.addEventListener("keydown", function(ev){
		if(ev.keyCode === 27){
			if(!fileSelection(false)){
				__picked = true; // cancel, no confirm on Esc
				args().path = false;
				try{ if(window.opener && window.opener.__fopnClosed){ window.opener.__fopnClosed(); } }catch(e){}
				window.close();
			}
		}
	});
	window.addEventListener("beforeunload", function(){
		if(!__picked){
			try{ if(window.opener && window.opener.__fopnClosed){ window.opener.__fopnClosed(); } }catch(e){}
		}
	});
	var startDir = (da.path && fs.exists(da.path) && fs.exists(da.path).isDir) ? da.path : (da.startDir || kbfs.appPath());
	if(da.path && fs.exists(da.path)){ startDir = da.path; }
	currentPath = "" + startDir;
	try{ if(window.opener && window.opener.__fopnDirList){ window.opener.__fopnDirList(currentPath, lastEntries); } }catch(e){}
	makePath();
	da.path = false;
	window.__fopnReady = true;
}catch(e){ console.log("FOPN-INIT-ERR " + e + " :: " + (e && e.stack)); window.__fopnErr = String(e);
}};
init();

</script>
