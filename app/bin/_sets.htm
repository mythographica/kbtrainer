<script language = "JavaScript">
	// selector.js replacement (Electron port): selector.js never shipped
	// with the port; its dialog-side job was injecting the current skin's
	// stylesheet. selector.fn() below is guarded for the same reason.
	(function(){
		try{
			var lk = document.createElement("link");
			lk.rel = "stylesheet";
			lk.type = "text/css";
			lk.href = "../skins/skin." + ((window.dialogArguments.usr && window.dialogArguments.usr.skin) || "native") + ".css";
			document.getElementsByTagName("head")[0].appendChild(lk);
		}catch(e){}
	})();
</script>

<script language="JavaScript">
<!--
var questor;

// Program.SettingsDialog (traced): each change the page makes is recorded
// right AFTER the era write, under the canonical profile name (userAliases:
// era pref names -> profile names) — the same value into the same cell the
// era write just made, so the domain only records. Best-effort: the page
// works without the domain.
var domain = window.dialogArguments.domain || null;
var aliases = (window.dialogArguments.kbstore && window.dialogArguments.kbstore.userAliases) || {};
var record = function(make){
	try{ if(domain){ make(domain); } }catch(e){}
};
var prefSet = function(name, value){
	record(function(dialog){ new dialog.PrefSet(aliases[name] || name, value); });
};
var mapsPairSet = function(){
	record(function(dialog){ new dialog.MapsPairSet(usr.selectedMaps[0], usr.selectedMaps[1]); });
};

scroller = function(){ try{ document.body.scrollTop = parseInt(document.body.scrollTop) + 50; }catch(e){}finally{} }

snk = {
	  setsClicker			: function(){
		usr.errMode = mix("snk.errMode.chk").checked ? true : false;
		prefSet("errMode", usr.errMode);
		if(!mix("snk.errMode.chk").checked){ mix("snk.oneErrOnly.chk").checked = false; }
		mix("snk.oneErrOnly.chk").disabled = usr.errMode ? false : true;
		usr.oneErrOnly = mix("snk.oneErrOnly.chk").checked ? true : false;
		prefSet("oneErrOnly", usr.oneErrOnly);

		usr.ErrAlwaysCount = mix("snk.ErrAlwaysCount.chk").checked ? true : false;
		prefSet("ErrAlwaysCount", usr.ErrAlwaysCount);
		usr.skipNonTypedCharacters = mix("snk.skipNonTypedCharacters.chk").checked ? true : false;
		prefSet("skipNonTypedCharacters", usr.skipNonTypedCharacters);
		usr.hideStatsOnPause = mix("snk.hideStatsOnPause.chk").checked ? true : false;
		prefSet("hideStatsOnPause", usr.hideStatsOnPause);

		//usr.shiftControl = mix("snk.shiftControl.chk").checked ? true : false;

		usr.spaceIsShiftSensentive = mix("snk.spaceIsShiftSensentive.chk").checked ? true : false;
		prefSet("spaceIsShiftSensentive", usr.spaceIsShiftSensentive);
		if(mix("snk.spaceIsShiftSensentive.chk").checked){
			mix("snk.spaceInvert.chk").disabled = false;
			usr.spaceInvert = mix("snk.spaceInvert.chk").checked ? true : false;
			prefSet("spaceInvert", usr.spaceInvert);
		}else{
			mix("snk.spaceInvert.chk").disabled = true;
		}
	}
	, reselectMapsArr		: function(par){

		layouts.resizer(0);

		var arr = par.split(".");
		var selm = "";
		var selmi = "";
		for(var i in usr.selectedMaps){
			var sm = usr.selectedMaps[i].split(".");
			if(sm[0] == arr[0]){
				selm = usr.selectedMaps[i];
				selmi = i;
			}
		}
		if(selm !== ""){ // 1 from 1

			usr.selectedMaps[selmi] = par;
			mapsPairSet();
			kb.loadselectedmaps();
			usr.currentMap = par.split(".")[0];
			kb.changeMap.map = usr.currentMap;
			//kb.langObj.In(kb.map[usr.currentMap].name);
			layouts.evaluator(usr.layouts);

			mix("snk."+selm+".chk").disabled = false;
			mix("snk."+selm+".chk").checked = false;
			mix.s("snk."+selm+".lbl").fontWeight = "normal";

			mix("snk."+par+".chk").disabled = true;
			mix("snk."+par+".chk").checked = true;
			mix.s("snk."+par+".lbl").fontWeight = "bold";

			layouts.resizer();
			layouts.resizer(true);
			layouts.translator(1);
			document.body.focus();
			snks.keychkb();
		}else{ // 1 from 2
			snk.reselectMapsArr.secondArr = [];
			snk.reselectMapsArr.secondArr[0] = [par, usr.selectedMaps[1]];
			snk.reselectMapsArr.secondArr[1] = [usr.selectedMaps[0], par];

			mix("snk."+par+".chk").checked = false;

			questor = snk.reselectMapsArr.secondArr;
			var ssm = "<form name = \"genF\">";

			tabindC = 0;
			for(var i in questor){
			  tabindC++;
				ssm += "<input type = \"radio\" id =\"radio_id_map" + i + "\" ";
				ssm += "name =\"radio_id_map\" value = \"" + i + "\"";
				ssm += " tabindex = " + tabindC + " ";
				if(i == 0){ ssm += " CHECKED "; }
				ssm += ">";
				ssm += "<label for=\"radio_id_map"+i+"\" >";
				ssm += " &nbsp;&nbsp;" + questor[i][0] + " &nbsp;&nbsp;&amp;&nbsp;&nbsp; " + questor[i][1] + " ";
				ssm += "</label><br />";
			}
			tabindC++;
			ssm += "<hr width = \"30%\" style = \"margin-left: 15px\">";
			ssm += "<input type = \"button\" tabindex = " + tabindC;
			ssm += " onclick = \"snk.selectNewMaps()\" value = \"OK\" style = \"width: 50px; margin-left: 50px\">"
			ssm += "</form>";

			mix.Fhide("mainDiv");
			mix.Fshow("questorDiv");
			mix.In("questorDiv", ssm);
			ssm = "";
		}

	}
	, selectNewMaps 		: function(){
		var mdaqwest = (mix("radio_id_map0").checked) ? 0 : 1;
		usr.selectedMaps = questor[mdaqwest];
		mapsPairSet();
		kb.loadselectedmaps();
		usr.currentMap = usr.selectedMaps[0].split(".")[0];
		kb.current_map = usr.currentMap;
		//kb.langObj.In(kb.map[usr.currentMap].name);
		for(var i in kb.mapsarr){
			if((usr.selectedMaps[0]==kb.mapsarr[i])
					|| (usr.selectedMaps[1]==kb.mapsarr[i])){
				mix("snk."+kb.mapsarr[i]+".chk").disabled = true;
				mix("snk."+kb.mapsarr[i]+".chk").checked = true;
				mix.s("snk."+kb.mapsarr[i]+".lbl").fontWeight = "bold";
			}else{
				mix("snk."+kb.mapsarr[i]+".chk").disabled = false;
				mix("snk."+kb.mapsarr[i]+".chk").checked = false;
				mix.s("snk."+kb.mapsarr[i]+".lbl").fontWeight = "normal";
			}
		}
		layouts.evaluator();
		layouts.resizer();
		layouts.resizer(true);
		layouts.translator(1);
		mix.Fhide("questorDiv");
		mix.Fshow("mainDiv");
		mix.In("questorDiv", " ");
		snks.keychkb();
	}	
	, resetKbChanger		: function(par){
		if(par == 1){ usr.mapChanger = new Array(0, 1, 1); }
		if(par == 2){ usr.mapChanger = new Array(1, 1, 0); }
	}
	, setskeybView			: function(){
		usr.keybView = mix("snk.keybView.chk").checked ? true : false;
		prefSet("keybView", usr.keybView);
		if(usr.keybView){

			mix("snk_keybSize_radio_id1").disabled = false;
			mix("snk_keybSize_radio_id2").disabled = false;
			mix("snk_keybSize_radio_id3").disabled = false;
			//mix.Fshow("snk_keybSize_radio_id1");
			//mix.Fshow("snk_keybSize_radio_id2");
			//mix.Fshow("snk_keybSize_radio_id3");

			//$("label[for='snk_keybSize_radio_id1']").show();
			//$("label[for='snk_keybSize_radio_id3']").show();
			//$("label[for='snk_keybSize_radio_id2']").show();
			
			mix("snk_layout_select_id").disabled = false;
			//mix.Fshow("snk_layout_select_id");
			mix("snk_layout_select_id").disabled = false;
			mix("snk.spaceInvert.chk").disabled = false;
			mix("snk.spaceIsShiftSensentive.chk").disabled = false;
			//mix.Fshow("strings.s25");
			//mix.Fshow("strings.s39");
			mix("snk.hiderInterval.txt").value = usr.hiderInterval;
			mix("snk.hider.chk").disabled = false;
			mix("snk.hiderInterval.txt").disabled = false;
			
		}else{

			mix("snk_keybSize_radio_id1").disabled = true;
			mix("snk_keybSize_radio_id2").disabled = true;
			mix("snk_keybSize_radio_id3").disabled = true;
			//mix.Fhide("snk_keybSize_radio_id1");
			//mix.Fhide("snk_keybSize_radio_id2");
			//mix.Fhide("snk_keybSize_radio_id3");

			//$("label[for='snk_keybSize_radio_id1']").hide();
			//$("label[for='snk_keybSize_radio_id2']").hide();
			//$("label[for='snk_keybSize_radio_id3']").hide();

			mix("snk_layout_select_id").disabled = true;
			mix("snk_layout_select_id").disabled = true;
			mix("snk.spaceInvert.chk").disabled = true;
			mix("snk.spaceIsShiftSensentive.chk").disabled = true;
			//mix.Fhide("strings.s25");
			//mix.Fhide("strings.s39");
			mix("snk.hider.chk").disabled = true;
			mix("snk.hiderInterval.txt").disabled = true;

		}
		if(!mix("snk.keybView.chk").checked){ 
			mix("snk.hider.chk").checked = false; 
		}
		
		usr.hider = mix("snk.hider.chk").checked ? true : false;
		prefSet("hider", usr.hider);
		if(usr.hider){
			$("label[for='snk.hider.chk']").html(strings.s36 + " " + strings.s37);
			mix.Fshow("snk.hiderInterval.txt");
		}else{
			$("label[for='snk.hider.chk']").html(strings.s36);
			mix.Fhide("snk.hiderInterval.txt");
		}
		layouts.resizer(usr.keybView);
		document.body.focus();
	}
	, checkHiderInterval		: function(){
		var par = parseInt(mix("snk.hiderInterval.txt").value);
		if((par < 999) && (par > 50)){
			usr.hiderInterval = par;
			prefSet("hiderInterval", usr.hiderInterval);
		}else{
			alert("Incorrect value. \n correct value is more than 50 but less than 999. ");
			mix("snk.hiderInterval.txt").value = usr.hiderInterval;
			mix("snk.hiderInterval.txt").focus();
		}
	}
	, reselectLayout		: function(){
		var ener = mix("snk_layout_select_id").value;
		if(usr.layouts != ener){
			usr.layouts = ener;
			prefSet("layouts", usr.layouts);
			layouts.selted = layouts.arr[ener];
			layouts.layoutLoad();
			layouts.evaluator();
			layouts.resizer();
			layouts.resizer(true);
			layouts.translator(1);
			layouts.resizer(usr.keybView);
			try{
				document.body.focus();
				mix("snk_layout_select_id").focus();
			}catch(e){
			}finally{}
		}
	}

	, reselectKbSize 		: function(par){
		if(usr.keybView){
			var ener = mix("snk_keybSize_radio_id"+par).value;
			if(usr.keybSize != ener){
				usr.keybSize = mix("snk_keybSize_radio_id"+par).value;
				prefSet("keybSize", usr.keybSize);
				//prefs.setCharPref("keybSize", usr.keybSize);
				layouts.evaluator();
				layouts.resizer();
				layouts.resizer(true);
				layouts.translator(1);
				try{
					document.body.focus();
					mix("snk_keybSize_radio_id"+par).focus();
				}catch(e){
				}finally{}
			}
		}
	}

	, reselectSkin				: function(){
		var ener = mix("snk_skin_select_id").value;
		if(ener != skins.selted[1]){
			var strptalm = "";
			var skinval;

			skinval = skins[ener];
			if(skinval.author != ""){
				strptalm += "powered by : " + skinval.author + "<br />";
			}
			if(skinval.link != ""){
				strptalm += "<a href = \"" + skinval.link + "\">" + skinval.link + "</a><br />";
			}
			if(skinval.mail != ""){
				strptalm += "<a href = \"mailto:" + skinval.mail + "\">" + skinval.mail + "</a><br />";
			}
			
			mix.In("kbKKLDivCont", strptalm);
			usr.skin = ener;
			prefSet("skin", usr.skin);
			// Program.SettingsDialog.SkinPreview (traced)
			record(function(dialog){ new dialog.SkinPreview(ener); });
			//prefs.setCharPref("skin", usr.skin);
			skins.selted = skins.arr[ener];
			skins.skinLoad();
			//kernel.layouts.evaluator();
			layouts.resizer();
			layouts.resizer(true);
			layouts.translator(1);
			// selector.js never shipped with the port (skin re-injection is
			// handled once at load above); the era call would throw here
			try{ if(typeof selector != "undefined"){ selector.fn(); } }catch(e){}
			//document.title = "here";
		}
		try{
			document.body.focus();
			mix("snk_skin_select_id").focus();
		}catch(e){
		}finally{}
	}

kbDown = function(event){
	var z = event.keyCode;
	if (z == 116){ event.returnValue = false; window.close(); }
	if(mix.hish("historyDiv")){
		if(ctrlK && (z == 68)){ snk.historyCleaner(); }
		if(ctrlK && (z == 72)){ snk.hideHistory(); }
	}
	if ((z == 10) || (z == 255) || ((z > 112) && (z < 116)) || ((z > 116) && (z < 123))){ fns.cancl(evt); } //!!! in place of return false !!!
}
