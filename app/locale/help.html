<h1>Описание</h1>

<br><br>
<a name="modes"></a>
<h2>Режимы</h2>
<pre>
"Программа" имеет два режима работы.
Уроки -- это когда вы печатаете заранее определенные уроки.
Книги -- выбираете любой ТЕКСТОВЫЙ файл, и печатаете его.
(для тех кто "в танке" ТЕКСТОВЫЙ и Microsoft &copy; Word Document
	-- это "две большие разницы").

При смене шкурок, раскладок, добавлении книги да и просто запуске
программы происходят заметные "тормоза".
Это особенности скриптовой реализации, так и должно быть.

Приложил много усилий для того, чтобы очень большие книги (50 мегобайт и больше)
вообще работали. Вроде бы получилось :)
Но грузятся они в библиотеку очень долго (десятки секунд).
Да и где вы видели такие книги?
Полное собрание сочинений Льва Толстого?
Одним файлом? И то, наверное -- маловато будет.
Обычно книги бывают не более 1го мегобайта.
</pre>


<a name="errs"></a>
<h2>Как считаются ошибки</h2>
<pre>
Если включен контроль ошибок, то ошибки будут учитываться.

При выключеном контроле ошибок они все-равно накапливаются,
но не учитываются.

Если включен режим "только одна ошибка",
то исправления стирают все набранные в позиции ошибок сразу.
При этом если включена опция "считать все ошибки",

В случае если "только одна ошибка" выключена, то ошибки стираются по одной,

var app = Vue.createApp({
  data: function () {
    return {
      // ru if the OS/browser says so, English otherwise
      lang: (navigator.language || '').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en',
      active: 'about'
    };
  },
  computed: {
    title: function () { return this.lang === 'ru' ? 'Справочная' : 'Help'; },
    sections: function () { return HELP[this.lang]; },
    current: function () {
      var found = null;
      for (var i = 0; i < this.sections.length; i++) {
        if (this.sections[i].id === this.active) found = this.sections[i];
      }
      return found || this.sections[0];
    }
  },
  methods: {
    go: function (id) { this.active = id; },
    setLang: function (l) {
      this.lang = l;
      // a section may exist in one language only (en has no Смысл/Спасибо)
      if (!HELP[l].some(function (s) { return s.id === this.active; }, this)) {
        this.active = HELP[l][0].id;
      }
    }
  },
  watch: {
    lang: {
      immediate: true,
      handler: function (l) { document.title = l === 'ru' ? 'Справочная' : 'Help'; }
    }
  },
  template: `
<div>
  <header class="hvu-bar">
    <h1 id="hvu-title">{{ title }}</h1>
    <div class="hvu-lang">
      <button id="hvu-en" type="button" :class="{ on: lang === 'en' }" @click="setLang('en')">EN</button>
      <button id="hvu-ru" type="button" :class="{ on: lang === 'ru' }" @click="setLang('ru')">RU</button>
    </div>
    <div class="hvu-hint">Esc &mdash; close / закрыть</div>
  </header>
  <div class="hvu-main">
    <nav class="hvu-menu">
      <button type="button" v-for="s in sections" :key="s.id"
              class="hvu-nav" :id="'hvu-nav-' + s.id" :class="{ on: s.id === active }"
              @click="go(s.id)">{{ s.title }}</button>
    </nav>
    <article id="hvu-content" v-html="current.html"></article>
  </div>
</div>
`
});

app.mount('#hvu');

// the smoke test listens for this
window.__hvuMounted = true;

// the original help was keyboard-driven: Esc closes the window
window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') window.close();
});
</script>
